name: Deploy site

# Site-only deploy. A push that changes the UI or the API builds and ships
# the website. It does not refresh prop data, so a data problem cannot block
# or undo a site fix. Data publishes on its own schedule in publish-data.yml.
# The two jobs use different concurrency groups, so they do not cancel or
# queue behind each other.

on:
  push:
    branches:
      - main
    paths:
      - "kbo-props-ui/src/**"
      - "kbo-props-ui/index.html"
      - "kbo-props-ui/scripts/**"
      - "kbo-props-ui/content/**"
      - "kbo-props-ui/public/**"
      - "kbo-props-ui/package*.json"
      - "kbo-props-ui/vite.config.*"
      - "kbo-props-ui/api/**"
      - "kbo-props-ui/vercel.json"
      - "kbo-props-ui/.vercelignore"
      - "kbo-props-ui/paidDataFiles.js"
      - "kbo-props-ui/cssLayerPlugin.js"
      - ".github/workflows/deploy.yml"
      # Negations stay last. A status or paid-snapshot commit must not ship a
      # new site. A push that also changes a path above still deploys.
      - "!kbo-props-ui/public/status.json"
      - "!kbo-props-ui/public/data/**"
      - "!ml/**"
      - "!.github/workflows/ml-*.yml"
      - "!.github/workflows/ml-*.yaml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: cgpropz-code-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: kbo-props-ui
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: kbo-props-ui/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Vercel Hobby function limit
        run: node scripts/check-function-limit.mjs

      - name: This job does not refresh data
        working-directory: .
        run: |
          if grep -E 'refresh_data\.py|refresh_odds\.py|run_release\.sh|build_projection_data\.py' .github/workflows/deploy.yml; then
            echo "The site deploy must not refresh or rebuild prop data."
            exit 1
          fi

      - name: Build the site
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to Vercel
        run: |
          npm i -g vercel@latest
          vercel --prod --token "$VERCEL_TOKEN" --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Confirms the new site is up and still hides paid files. It does not
      # fail when the prop numbers are old. That check lives on the data job.
      - name: Check the live site still hides paid data
        working-directory: .
        run: |
          pip install requests
          for attempt in 1 2 3 4; do
            echo "Site check attempt ${attempt}/4"
            if python pipeline/verify_production_data.py --base-url https://cgpropz.com --site-only; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              sleep 15
            fi
          done
          echo "The new site failed the paid-data check"
          exit 1

      - name: Notify on failure (open/update issue)
        if: failure()
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/notify-failure.sh "🚨 Site deploy FAILED"
