name: Refresh NHL PrizePicks Board

# Schedule runs only on the default branch, and the job also refuses any
# other ref. A pull request cannot publish NHL snapshots.
#
# The :19/:49 cron is a backup, not the clock. GitHub skips the first ticks
# of a new workflow and drops most every-30-minute schedules (the NFL board
# cron was landing every 3-6 hours). The file is on the default branch at
# .github/workflows/nhl-refresh.yml and the manual run proved the YAML. A
# finished run on main waits, then queues the next one, same as the NFL
# Unabated job. The push below starts that chain when this file lands.

on:
  schedule:
    - cron: "19,49 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "nhl/**"
      - ".github/workflows/nhl-refresh.yml"
      - "kbo-props-ui/src/nhl/**"
      - "pipeline/memory/grade_nhl_day.py"

permissions:
  contents: write
  actions: write

concurrency:
  group: nhl-refresh-pipeline
  cancel-in-progress: false

jobs:
  refresh-nhl:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install snapshot dependencies
        run: pip install requests "psycopg[binary]"

      - name: Download MoneyPuck game logs
        run: python nhl/fetch_history.py

      - name: Build the NHL board and lineups
        run: python -m nhl.build_board --root /tmp/moneypuck
        env:
          BOARD_READER_DB_URL: ${{ secrets.BOARD_READER_DB_URL }}

      - name: Match PrizePicks lines to Unabated
        continue-on-error: true
        run: python -m nhl.sharp_odds

      # After the board. continue-on-error plus an exit 0 when the files are
      # short so a DvP miss cannot skip publish or the memory/ slate freeze.
      # A good build still lands before publish, so this run can ship it.
      - name: Build NHL defense vs position
        continue-on-error: true
        run: python -m nhl.build_dvp --root /tmp/moneypuck

      - name: Build NHL prop correlations
        continue-on-error: true
        run: python pipeline/build_correlations.py --sport nhl --root /tmp/moneypuck

      - name: Publish protected NHL snapshot
        run: python publish_supabase.py
        env:
          PUBLISH_ONLY_PREFIX: "nhl/"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Publish public board status
        if: always()
        continue-on-error: true
        run: |
          bash pipeline/commit_status.sh "chore: nhl board status"

      - name: Freeze NHL slate into memory/
        if: success()
        continue-on-error: true
        run: python pipeline/memory/freeze_slate.py --sport nhl

      # Same publisher as KBO, WNBA, and NFL. It commits only memory/ from a
      # clean worktree of origin/main and retries a rejected push, so this
      # 25-minute chain can overlap the daily grade job without dropping the
      # slate. The commit happens before the wait below. A memory/ push does
      # not match this workflow's path filter, so it does not start another run.
      # Logging only for a future hits model; not shown on the site.
      - name: Log PrizePicks NHL hits lines (standard; goblin/demon to lines_alt/)
        continue-on-error: true
        run: python -m nhl.hits_log --only lines

      - name: Publish memory/nhl slate freeze
        if: success()
        continue-on-error: true
        run: |
          bash pipeline/memory/commit_memory.sh "chore: nhl memory slate freeze"

      # Holds this runner until the next board is due, then starts it. The
      # cron above only restarts the chain if this handoff dies.
      - name: Queue the next NHL board
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NHL_REFRESH_WAIT_SECONDS: "1500"
        run: |
          echo "Next NHL board in ${NHL_REFRESH_WAIT_SECONDS}s"
          sleep "${NHL_REFRESH_WAIT_SECONDS}"
          gh workflow run nhl-refresh.yml --ref main
