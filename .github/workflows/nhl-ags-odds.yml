name: NHL AGS Odds Daily Pull

# Daily NHL anytime-goalscorer (AGS) odds plus game/team totals, research only.
# Takes over Sniper Bot's 11:07 AM ET routine. Same script, same files:
#   shared/lab/nhl_ags_odds/data/YYYY-MM-DD_ags.csv
#   shared/lab/nhl_ags_odds/data/YYYY-MM-DD_games.csv
#   shared/lab/nhl_ags_odds/athlete_cache.json, collect.log
# Source: ESPN public JSON (DraftKings odds as shown by ESPN). No API key.
# The date is the ET calendar day; games already started are skipped.

on:
  schedule:
    # 15:07 UTC = 11:07 AM EDT. After DST ends (Sun Nov 1, 2026) this fires at
    # 10:07 AM EST; move it to "7 16 * * *" then to keep 11:07 AM ET.
    - cron: "7 15 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-collect even if today's files exist (overwrites today's CSVs)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: nhl-ags-odds
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect NHL AGS odds and game/team totals
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python shared/lab/nhl_ags_odds/collect.py --force
          else
            python shared/lab/nhl_ags_odds/collect.py
          fi

      - name: ET date for the artifact name
        id: etdate
        run: echo "date=$(TZ=America/New_York date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # Research data stays out of git (public repo): upload as an artifact.
      - name: Upload shared/lab/nhl_ags_odds as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: nhl-ags-odds-${{ steps.etdate.outputs.date }}
          path: |
            shared/lab/nhl_ags_odds/data/*.csv
            shared/lab/nhl_ags_odds/athlete_cache.json
            shared/lab/nhl_ags_odds/collect.log
          retention-days: 90
          if-no-files-found: warn
