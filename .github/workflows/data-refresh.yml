name: Intraday Odds Refresh

on:
  schedule:
    # Recalculate line-sensitive prop projections every 30 minutes.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  # Separate group from the full deploy so odds refreshes don't queue
  # behind a 14-minute pipeline run. cancel-in-progress: true means if a
  # new odds refresh is triggered while one is already queued, the queued
  # one is dropped and only the freshest run executes.
  group: kbo-odds-refresh
  cancel-in-progress: true

jobs:
  refresh-odds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          # Playwright is the fallback path for Baseball Reference (their CDN
          # often returns 403 to GitHub Actions IPs). Without the browser,
          # build_opponent_stats falls back to nothing and we'd preserve the
          # prior snapshot — but that means stats stop refreshing entirely.
          playwright install chromium --with-deps

      - name: Restore last published snapshots (paid data is not in git)
        run: python pipeline/restore_snapshots.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}

      - name: Refresh odds-derived projection snapshots
        run: |
          for attempt in 1 2 3; do
            echo "Refresh attempt ${attempt}/3"
            if python refresh_odds.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Refresh failed, retrying in 20s..."
              sleep 20
            fi
          done
          echo "Refresh failed after 3 attempts"
          exit 1
        timeout-minutes: 20
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Commit refreshed odds-derived snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Paid snapshots (public/data/*) are published to Supabase by
          # refresh_odds.py and served via /api/data; they are git-ignored and
          # must never be committed. Only the raw odds inputs are committed.
          git add KBO-Odds/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No odds changes to commit"
          else
            git commit -m "chore: intraday odds refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if ! git push origin HEAD:main; then
              echo "Push rejected; attempting one rebase+push retry"
              if git pull --rebase origin main && git push origin HEAD:main; then
                echo "Retry push succeeded"
              else
                # Never continue with a conflicted worktree; downstream steps read JSON files.
                # Keep locally-refreshed odds files so deploy still ships fresh data
                # even when committing back to main loses a race.
                git rebase --abort >/dev/null 2>&1 || true
                echo "Retry push failed (likely race/merge conflict) — continuing to deploy current build"
              fi
            fi
          fi


      # The former "Build and deploy odds-only update to Vercel" step existed only
      # to ship refreshed static JSON. Paid data now reaches the site through
      # Supabase + /api/data (published by refresh_odds.py above), so no deploy
      # is needed for an odds refresh.

      - name: Freeze KBO slate into memory/
        if: success()
        continue-on-error: true
        run: python pipeline/memory/freeze_slate.py --sport kbo

      - name: Publish memory/ slate freeze
        if: success()
        continue-on-error: true
        run: |
          bash pipeline/memory/commit_memory.sh "chore: kbo memory slate freeze"

      # Email-on-failure: create/update a GitHub issue when this scheduled
      # job fails. GitHub's default notification settings will email the repo
      # owner whenever an issue is opened or commented on.
      - name: Notify on failure (open/update issue)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TITLE="🚨 Intraday odds refresh FAILED"
          BODY="Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Branch: $GITHUB_REF_NAME
          Commit: $GITHUB_SHA"
          # Try to find an existing open issue with this title; comment on it
          # so we don't spam new issues every 10 min during an outage.
          EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number' || echo "")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "ci-failure" 2>/dev/null \
              || gh issue create --title "$TITLE" --body "$BODY"
          fi
