name: Intraday Odds Refresh

# Hourly cron during the hours a KBO window can be open. A 60-minute sleep
# would bill the wait (~8 links × ~63 min), and a chain with no sleep would
# scrape again as soon as this job finished. The :17 tick avoids the crowded
# :00/:30 minutes. The :07/:37 cron stays as the off-day backup.
#
# The first step after checkout exits unless this is a manual run, the live
# schedule is inside the window (5 hours before first pitch through 3 hours
# after), and no successful scrape finished in the last 50 minutes. That
# keeps the backup from doubling the hourly run, and it skips pip and
# Playwright on off days.
#
# One tip, about 8 scrapes × ~3 min of work (measured 1.6-5.4), plus about
# one minute for every other tick (62 starts: 14 hourly hours + 48 backup).
# Game day ≈ 80 billed minutes. Off day ≈ 62. The old 25-minute chain was
# about 450.

on:
  schedule:
    # Game-window hours, UTC. First pitch is KST (UTC+9); the window can
    # open around 23:00 UTC and close around 12:30 UTC.
    - cron: "17 0-12,23 * * *"
    # Off-day backup. A run inside 50 minutes of a real scrape exits early.
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/data-refresh.yml"
      - "pipeline/refresh_window.py"

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  # Separate group from the full deploy so odds refreshes don't queue
  # behind a pipeline run. cancel-in-progress stays false so a backup tick
  # waits, then the 50-minute guard skips it if this run already scraped.
  group: kbo-odds-refresh
  cancel-in-progress: false

jobs:
  refresh-odds:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Decide whether this run should refresh
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/refresh-due.sh data-refresh.yml kbo

      - name: Set up Python
        if: steps.gate.outputs.due == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        if: steps.gate.outputs.due == 'true'
        run: |
          pip install -r requirements.txt
          # Playwright is the fallback path for Baseball Reference (their CDN
          # often returns 403 to GitHub Actions IPs). Without the browser,
          # build_opponent_stats falls back to nothing and we'd preserve the
          # prior snapshot — but that means stats stop refreshing entirely.
          playwright install chromium --with-deps

      - name: Restore last published snapshots (paid data is not in git)
        if: steps.gate.outputs.due == 'true'
        run: python pipeline/restore_snapshots.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}

      - name: Refresh odds-derived projection snapshots
        if: steps.gate.outputs.due == 'true'
        run: |
          for attempt in 1 2 3; do
            echo "Refresh attempt ${attempt}/3"
            if python refresh_odds.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              # Outer backoff in addition to the fetcher's own retry. The
              # fetcher logs the HTTP status and a short response snippet.
              delay=$((attempt * 15))
              echo "Refresh failed, retrying in ${delay}s..."
              sleep "$delay"
            fi
          done
          echo "Refresh failed after 3 attempts"
          exit 1
        timeout-minutes: 20
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}

      - name: Set up Node.js
        if: steps.gate.outputs.due == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Commit refreshed odds-derived snapshots
        if: steps.gate.outputs.due == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Paid snapshots (public/data/*) are published to Supabase by
          # refresh_odds.py and served via /api/data; they are git-ignored and
          # must never be committed. Only the raw odds inputs are committed.
          # public/status.json is published by the next step, not this one.
          git add KBO-Odds/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No odds changes to commit"
          else
            git commit -m "chore: intraday odds refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if ! git push origin HEAD:main; then
              echo "Push rejected; attempting one rebase+push retry"
              if git pull --rebase origin main && git push origin HEAD:main; then
                echo "Retry push succeeded"
              else
                # Never continue with a conflicted worktree; downstream steps read JSON files.
                # Keep locally-refreshed odds files so deploy still ships fresh data
                # even when committing back to main loses a race.
                git rebase --abort >/dev/null 2>&1 || true
                echo "Retry push failed (likely race/merge conflict) — continuing to deploy current build"
              fi
            fi
          fi

      - name: Publish public board status
        if: steps.gate.outputs.due == 'true' && success()
        continue-on-error: true
        run: |
          bash pipeline/commit_status.sh "chore: kbo board status"

      - name: Build KBO prop correlations
        if: steps.gate.outputs.due == 'true'
        continue-on-error: true
        run: python pipeline/build_correlations.py --sport kbo

      - name: Publish KBO prop correlations
        if: steps.gate.outputs.due == 'true'
        continue-on-error: true
        run: python publish_supabase.py
        env:
          PUBLISH_ONLY_PREFIX: correlations_kbo.json
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}

      # The former "Build and deploy odds-only update to Vercel" step existed only
      # to ship refreshed static JSON. Paid data now reaches the site through
      # Supabase + /api/data (published by refresh_odds.py above), so no deploy
      # is needed for an odds refresh.

      - name: Freeze KBO slate into memory/
        if: steps.gate.outputs.due == 'true' && success()
        continue-on-error: true
        run: python pipeline/memory/freeze_slate.py --sport kbo

      - name: Publish memory/ slate freeze
        if: steps.gate.outputs.due == 'true' && success()
        continue-on-error: true
        run: |
          bash pipeline/memory/commit_memory.sh "chore: kbo memory slate freeze"

      # Email-on-failure: create/update a GitHub issue when this scheduled
      # job fails. GitHub's default notification settings will email the repo
      # owner whenever an issue is opened or commented on.
      - name: Notify on failure (open/update issue)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/notify-failure.sh "🚨 Intraday odds refresh FAILED"
