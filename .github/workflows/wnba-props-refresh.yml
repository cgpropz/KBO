name: Refresh WNBA PrizePicks Lines (30 min)

# Lightweight intraday refresh of ONLY the WNBA PrizePicks prop lines.
#
# This job boots the bundled WNBA backend, forces a fresh PrizePicks partner-API
# scrape, re-exports ONLY the projection snapshots (projections_{standard,demon,
# goblin}.json — these carry the live prop lines + hit rates), and publishes
# ONLY those three tables to Supabase (the authoritative source the frontend
# reads).
#
# It deliberately does NOT:
#   • regenerate gamelogs / boxscores (read live from the committed CSVs),
#   • re-export or publish players / teams / lineups / edge / dvp snapshots,
#   • commit anything to the repo.
#
# It DOES rebuild the local DvP CSV tables from the committed boxscores before
# export verification so SOURCE_THROUGH stays aligned with the latest games.
# Projection baselines can nudge when those tables catch up after a full refresh
# that previously omitted committing them; prop lines remain the primary delta.
#
# Net effect: the website prop lines refresh every 30 minutes while every other
# piece of WNBA data stays exactly as the last full refresh (or a manual update)
# left it. If a scrape returns no lines (off-hours / no slate), the publish step
# is skipped so existing good lines are never overwritten with blanks.

on:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Share the full-refresh lock so a props job never publishes projections built
  # from an older checkout after a gamelog refresh has completed.
  group: wnba-refresh-pipeline
  cancel-in-progress: false

jobs:
  refresh-wnba-props:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install WNBA backend dependencies
        working-directory: wnba/backend
        run: npm ci || npm install

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install requests pandas

      # Rebuild DvP CSVs from the committed boxscores so SOURCE_THROUGH stays
      # aligned even if a prior full refresh omitted committing the tables.
      # Must run before the backend boots so exported projections use fresh DvP.
      - name: Generate current WNBA DvP tables
        run: python wnba/generate_wnba_dvp.py

      - name: Force fresh PrizePicks scrape (drop any cached snapshot)
        run: rm -f wnba/downloaded_files/prizepicks_*.json

      - name: Refresh Unabated sharp odds
        working-directory: wnba
        env:
          PYTHONUNBUFFERED: '1'
        continue-on-error: true
        run: python unabated_props_data.py

      - name: Boot WNBA backend
        working-directory: wnba/backend
        run: |
          PORT=5050 node index.js > "$RUNNER_TEMP/wnba-backend.log" 2>&1 &
          echo "BACKEND_PID=$!" >> "$GITHUB_ENV"
        env:
          PYTHON_BIN: python3
          # Optional. Empty when the secret is not configured; the backend then
          # skips The Odds API and uses ESPN spreads (display-only field).
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Wait for backend to be ready
        run: |
          for attempt in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:5050/api/teams; then
              echo "Backend is ready (attempt ${attempt})"
              exit 0
            fi
            echo "Waiting for backend... (${attempt}/30)"
            sleep 2
          done
          echo "Backend did not become ready in time. Log:"
          cat "$RUNNER_TEMP/wnba-backend.log" || true
          exit 1

      - name: Restore last published WNBA snapshots (paid data is not in git)
        run: python pipeline/restore_snapshots.py --prefix wnba/
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Export WNBA projection (prop-line) snapshots only
        run: node wnba/export_snapshots.mjs
        env:
          BACKEND_URL: http://localhost:5050
          EXPORT_ONLY: projections

      - name: Verify exported prop gamelogs are current
        run: python wnba/verify_snapshot_gamelogs.py

      - name: Verify WNBA DvP and official prop positions
        run: python wnba/verify_wnba_dvp.py

      - name: Stop WNBA backend
        if: always()
        run: |
          if [ -n "${BACKEND_PID:-}" ]; then
            kill "$BACKEND_PID" 2>/dev/null || true
          fi

      - name: Verify fresh PrizePicks lines were fetched
        id: check_lines
        run: |
          COUNT=$(node -e "const d=require('./kbo-props-ui/public/data/wnba/projections_standard.json'); let n=0; for (const r of d) { n += (r.ppAllProps?.length || 0); } console.log(n);")
          echo "PrizePicks prop line count: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "has_lines=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_lines=false" >> "$GITHUB_OUTPUT"
            echo "No PrizePicks lines available this run — skipping publish so existing lines are preserved."
          fi

      - name: Publish WNBA prop lines to Supabase
        if: steps.check_lines.outputs.has_lines == 'true'
        run: python publish_supabase.py
        env:
          PUBLISH_ONLY_PREFIX: "wnba/projections"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # The former "Commit refreshed WNBA projection snapshots" step pushed the
      # paid prop-line boards to the public repo. They now live only in Supabase
      # (published above) and are served through /api/data.

      - name: Freeze WNBA slate into memory/
        if: success() && steps.check_lines.outputs.has_lines == 'true'
        continue-on-error: true
        run: python pipeline/memory/freeze_slate.py --sport wnba

      - name: Publish memory/ slate freeze
        if: success() && steps.check_lines.outputs.has_lines == 'true'
        continue-on-error: true
        run: |
          bash pipeline/memory/commit_memory.sh "chore: wnba memory slate freeze"
