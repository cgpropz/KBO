name: Preview site

# A pull request that changes the site gets a Vercel preview. Production
# stays on the main deploy workflow. Do not pass --prod here.

on:
  pull_request:
    paths:
      - "kbo-props-ui/src/**"
      - "kbo-props-ui/index.html"
      - "kbo-props-ui/scripts/**"
      - "kbo-props-ui/content/**"
      - "kbo-props-ui/public/**"
      - "kbo-props-ui/package*.json"
      - "kbo-props-ui/vite.config.*"
      - "kbo-props-ui/api/**"
      - "kbo-props-ui/vercel.json"
      - "kbo-props-ui/.vercelignore"
      - "kbo-props-ui/.vercel/project.json"
      - "kbo-props-ui/paidDataFiles.js"
      - "kbo-props-ui/cssLayerPlugin.js"
      - ".github/workflows/preview.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: cgpropz-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: kbo-props-ui
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Delete public member hub proof artifacts
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api --paginate repos/cgpropz/KBO/actions/artifacts --jq '.artifacts[] | select(.name=="member-hub-proof") | .id')
          for id in $ids; do
            gh api -X DELETE "/repos/cgpropz/KBO/actions/artifacts/${id}"
            echo "deleted ${id}"
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: kbo-props-ui/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Vercel Hobby function limit
        run: node scripts/check-function-limit.mjs

      - name: Bake the public NFL preview
        run: node scripts/bake-landing-preview.mjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Deploy preview
        id: preview
        run: |
          npm i -g vercel@64.2.0
          url=$(vercel deploy --token "$VERCEL_TOKEN" --yes \
            --build-env "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" \
            --build-env "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY" \
            --env "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" \
            --env "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY" \
            --env "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Time the signed-in member hub
        run: node scripts/member-hub-proof.mjs
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MEMBER_EMAIL: sev1-hub-preview@example.com

      - name: Remove the proof member
        if: always()
        run: node scripts/member-hub-proof.mjs --cleanup
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MEMBER_EMAIL: sev1-hub-preview@example.com

      - name: Save member hub proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: member-hub-proof
          path: kbo-props-ui/member-hub-proof/timings.json
          if-no-files-found: ignore

      - name: Screenshot and Lighthouse the preview
        run: node scripts/preview-audit.mjs
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Save preview audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-audit
          path: kbo-props-ui/preview-audit/*
          if-no-files-found: ignore
