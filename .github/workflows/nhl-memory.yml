name: NHL Props Memory Grade

# Grades yesterday and today from the official NHL box score once games are
# final. The schedule runs only after this file is on main, and the job
# refuses every other ref.

on:
  schedule:
    - cron: '30 11 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: "Optional day (mm/dd/YYYY or YYYY-MM-DD)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: nhl-memory
  cancel-in-progress: false

jobs:
  grade-nhl-memory:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Grade NHL memory day
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python pipeline/memory/grade_nhl_day.py --date "${{ github.event.inputs.date }}"
          else
            python pipeline/memory/grade_nhl_day.py
          fi

      # Logging only for a future hits model; skips days with no final games.
      - name: Log NHL per-game hits
        continue-on-error: true
        run: python -m nhl.hits_log --only games --days 3

      - name: Publish memory/
        run: |
          bash pipeline/memory/commit_memory.sh "chore: nhl memory grade"
