name: WNBA Props Memory Grade

# Grades yesterday's ET gameDate after the midnight WNBA full refresh lands
# finalized boxscores.

on:
  schedule:
    - cron: "0 5 * * *" # 1:00 AM ET — after midnight full refresh
  workflow_dispatch:
    inputs:
      date:
        description: "Optional ET game date (mm/dd/YYYY or YYYY-MM-DD)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: wnba-memory
  cancel-in-progress: false

jobs:
  grade-wnba-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pandas requests

      - name: Grade WNBA memory day
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python pipeline/memory/grade_wnba_day.py --date "${{ github.event.inputs.date }}"
          else
            python pipeline/memory/grade_wnba_day.py
          fi

      - name: Publish memory/
        run: |
          bash pipeline/memory/commit_memory.sh "chore: wnba memory grade"
