name: Refresh NFL PrizePicks Board

# This cron is the full board plus the memory freeze. It is not the live odds
# clock. GitHub drops most "every 30 minutes" schedules (this one was landing
# every 3-6 hours). nfl-odds-live.yml re-queues itself so Unabated prices and
# PrizePicks EV actually refresh about every 30 minutes. The step at the
# bottom starts that chain if it is not already running.

on:
  schedule:
    # Off the top/half of the hour on purpose: GitHub delays or drops scheduled
    # runs at :00/:30 under load (observed 2026-09-26..28: this "every 30 min"
    # job actually ran only every ~3-6 h). Same 30-minute cadence.
    - cron: "17,47 * * * *"
    # Extra inactive-check runs on NFL game days (Sun; Mon for MNF; Thu for
    # TNF) so a late ESPN Out comes off before lock. Each run is the full
    # board build, so it re-reads ESPN and nfl/manual_out.json. Cron is UTC.
    # Day-of-week is the UTC day: an evening ET run lands after 00:00 UTC on
    # the next day (Sun night -> Mon, MNF -> Tue, TNF -> Fri).
    # EDT (UTC-4, until Sun Nov 1, 2026):
    #   11:45 AM ET inactives -> 15:45 UTC; 12:50 PM pre-lock -> 16:50 UTC
    #   3:50 PM ET -> 19:50 UTC; 4:20 PM pre-lock -> 20:20 UTC
    #   7:32 PM ET -> 23:32 UTC; 8:10 PM pre-lock -> 00:10 UTC next day
    # (7:32, not 7:30: GitHub drops more runs at :00/:30.)
    - cron: "45 15 * * 0,1,4"
    - cron: "50 16 * * 0,1,4"
    - cron: "50 19 * * 0,1,4"
    - cron: "20 20 * * 0,1,4"
    - cron: "32 23 * * 0,1,4"
    - cron: "10 0 * * 1,2,5"
    # EST (UTC-5, from Nov 1, 2026): same ET times one UTC hour later. Both
    # sets stay on so nothing is missed at the switch; during EDT these are
    # one extra run an hour later, and during EST the EDT set runs an hour
    # early. GitHub can still delay any of these; the :17/:47 chain above
    # keeps running in between.
    - cron: "45 16 * * 0,1,4"
    - cron: "50 17 * * 0,1,4"
    - cron: "50 20 * * 0,1,4"
    - cron: "20 21 * * 0,1,4"
    - cron: "32 0 * * 1,2,5"
    - cron: "10 1 * * 1,2,5"
  workflow_dispatch:
  # A merge that changes the NFL builder or board used to wait on that flaky
  # cron. The site reads Supabase, so the push that lands the code has to
  # publish nfl_projections and nfl_sharp_odds itself.
  push:
    branches:
      - main
    paths:
      - "nfl/**"
      - ".github/workflows/nfl-refresh.yml"
      - "kbo-props-ui/src/nfl/**"
      - "pipeline/memory/grade_nfl_day.py"

permissions:
  contents: write
  actions: write

concurrency:
  group: nfl-refresh-pipeline
  cancel-in-progress: false

jobs:
  refresh-nfl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install snapshot dependencies
        run: pip install pandas requests "psycopg[binary]"

      # The builder inserts the repo root on sys.path before importing pipeline.
      # This invocation puts nfl/ on sys.path[0], so the import needs that insert.
      - name: Build current NFL projections and starting lineups
        run: python nfl/build_projection_data.py
        env:
          BOARD_READER_DB_URL: ${{ secrets.BOARD_READER_DB_URL }}

      - name: Build NFL prop correlations
        continue-on-error: true
        run: python pipeline/build_correlations.py --sport nfl

      # Public Unabated JSON (same feed as WNBA). No ODDS_API_KEY. A failure
      # here must not block the PrizePicks board publish below.
      - name: Match NFL PrizePicks lines to Unabated sportsbook odds
        continue-on-error: true
        run: python nfl/sharp_odds.py

      # Full-game spread, total, and moneyline. Unabated only. A failure here
      # must not block the PrizePicks board publish below. The script also
      # writes memory/nfl/game_markets/ (the published board for the day, and
      # one Unabated line capture per run).
      - name: Build NFL game-market projections
        continue-on-error: true
        run: python nfl/game_markets.py

      # commit_memory.sh pushes only memory/ with the checkout GITHUB_TOKEN.
      # That token does not start another workflow run. deploy.yml's push
      # paths do not include memory/**, so this commit cannot redeploy.
      - name: Publish NFL game-market memory archive
        if: always()
        continue-on-error: true
        run: |
          bash pipeline/memory/commit_memory.sh "chore: nfl game market archive"

      - name: Publish protected NFL snapshot
        timeout-minutes: 10
        run: python publish_supabase.py
        env:
          PUBLISH_ONLY_PREFIX: "nfl/"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Publish public board status
        if: always()
        continue-on-error: true
        run: |
          bash pipeline/commit_status.sh "chore: nfl board status"

      - name: Freeze NFL slate into memory/
        if: success()
        continue-on-error: true
        run: python pipeline/memory/freeze_slate.py --sport nfl

      - name: Publish memory/nfl slate freeze
        if: success()
        continue-on-error: true
        run: |
          bash pipeline/memory/commit_memory.sh "chore: nfl memory slate freeze"

      - name: Keep Unabated odds refreshing
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nfl-odds-live.yml --ref main
