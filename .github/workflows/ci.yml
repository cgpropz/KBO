# Pull-request checks. Read-only: never deploys, publishes, or commits.
# Before this, no workflow ran the existing Python/JS test suites on PRs.
name: CI (PR checks)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      # The props window check reaches the public WNBA, NBA, and KBO schedules.
      # Everything else is offline and uses no secrets.
      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider test_*.py pipeline/memory ml/tests

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kbo-props-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: kbo-props-ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Vercel Hobby function limit
        run: node scripts/check-function-limit.mjs
      - name: API unit tests
        run: npm run test:api
      - name: Install Playwright Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Mobile layout
        run: npm run test:mobile
      - name: Production build
        run: npm run build
      - name: KBO results stay off the built site
        run: CHECK_KBO_RESULTS_DIST=1 node --test tests/kbo-results-hidden.test.mjs
      # `npm run lint` currently reports pre-existing errors on main
      # (SlipOptimizer.jsx, StrikeoutProjections.jsx, ...). Report them without
      # blocking until they are cleaned up.
      - name: Lint (non-blocking)
        continue-on-error: true
        run: npm run lint

  phone-width:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kbo-props-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: kbo-props-ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build the site
        run: npm run build
      - name: iPhone width check
        run: npm run test:phone
        env:
          PHONE_SKIP_BUILD: "1"
          CI: "true"
      - name: Save board screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-boards
          path: kbo-props-ui/phone-screenshots/*.png
          if-no-files-found: ignore
      - name: Comment the screenshots on the pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- phone-width-screenshots -->'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              marker,
              '### Phone board screenshots',
              '',
              'iPhone-width pictures of the NFL, NHL, KBO, and WNBA boards are attached to this check as **phone-boards**.',
              '',
              `Open them here: ${runUrl}`,
              '',
              'The check fails if a page is wider than the viewport: iPhone portrait (390), a desktop-site iPhone (980), and a 780px window, in Safari and in the X app. Screenshots are the public boards only.',
            ].join('\n')
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const existing = comments.find((comment) => (comment.body || '').includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }
