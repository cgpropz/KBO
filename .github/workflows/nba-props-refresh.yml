name: Refresh NBA PrizePicks Lines (hourly)

# Lightweight refresh of NBA PrizePicks lines and the projections on them.
#
# Rebuilds DVP from the committed box scores, fetches the current board, fills
# projections, and publishes only the three projection tables. It does not
# refresh ESPN logs or publish players, teams, or DVP. The only commit is
# kbo-props-ui/public/status.json (clocks and prop counts, never the rows).
#
# A pull with zero lines skips publish. publish_supabase.py also refuses to
# replace a projection table with a zero-line file, unless this run expired
# every remaining game. nba_public is not changed.
#
# Hourly cron, not a slept chain. A 60-minute sleep would bill the wait, and
# a chain with no sleep would scrape again as soon as this job finished.
# The :17 tick covers the UTC hours an NBA window can be open. :07 and :37
# during those hours cover a dropped :17. The :22/:52 cron stays as the
# off-day backup. Outside the window the gate logs
# "skipped: gate (outside game window)" and the refresh job is skipped.
# Inside the window a public board clock older than 110 minutes always
# refreshes. Otherwise a run scrapes only when no successful scrape finished
# in the last 50 minutes.
#
# GitHub drops most of these ticks (Oct 20: 8 of ~73 slots fired between
# 00:00 and 15:13 UTC, none from 13:03 to 15:13). nhl-refresh and
# nfl-odds-live requeue themselves about every 25 minutes, and each of those
# runs checks this gate through nba-due-kick.yml and starts this workflow
# with -f trigger=nba-due when NBA is due. That run keeps the window, the
# 50-minute guard, and the 5-minute earlier-run rule, so it never scrapes
# twice. A plain manual dispatch still always refreshes.
#
# The 4:00 AM ET post-finals rebuild is nba-refresh.yml (08:00 UTC, an 08:20
# UTC backup, and a morning wake from nba-due-kick.yml). This props gate stays
# tip-5h..tip+3h (pipeline/refresh_window.py WINDOW_BEFORE / WINDOW_AFTER).
# Keep it there: after a late tip the window is already closed, and this job
# is not the overnight full refresh.
#
# One tip, about 8 scrapes × ~1 min of work (measured 0.6-0.9), plus about
# one minute for every other tick (71 starts: 23 hourly hours + 48 backup).
# Game day ≈ 70 billed minutes. Off day ≈ 71. The old 25-minute chain was
# about 420. A longer slate adds about one scrape per extra hour.

on:
  schedule:
    # Early tips through west-coast finals, both EST and EDT.
    - cron: "17 0-9,11-23 * * *"
    # Same hours, offset from :17, so a dropped GitHub tick still lands this hour.
    - cron: "7,37 0-9,11-23 * * *"
    # Off-day backup. A run inside 50 minutes of a real scrape exits early.
    - cron: "22,52 * * * *" # every 30 minutes (UTC)
  workflow_dispatch:
    inputs:
      trigger:
        # Empty for a manual run (always refreshes). nba-due is the kick from
        # nba-due-kick.yml or the board freeze; refresh-due.sh gives it the
        # scheduled gate (window, 50-minute guard, no second run within 5
        # minutes).
        description: "Leave empty for a manual run"
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/nba-props-refresh.yml"

permissions:
  contents: write
  actions: read

concurrency:
  # Share the full-refresh lock so a props job never publishes projections
  # built from an older checkout after a gamelog refresh has completed.
  # Do not cancel an in-progress run. The next tick waits, then the 50-minute
  # guard skips it if this run already scraped.
  group: nba-refresh-pipeline
  cancel-in-progress: false

jobs:
  gate:
    name: Decide whether this run should refresh
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.gate.outputs.due }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Decide whether this run should refresh
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESH_TRIGGER: ${{ inputs.trigger }}
        run: bash .github/scripts/refresh-due.sh nba-props-refresh.yml nba

      - name: "skipped: gate (outside game window)"
        if: steps.gate.outputs.reason == 'outside'
        run: |
          echo "skipped: gate (outside game window)"

  refresh-nba-props:
    name: Refresh NBA PrizePicks lines
    needs: gate
    if: github.ref == 'refs/heads/main' && needs.gate.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install requests pandas

      - name: Generate five-position NBA DVP tables
        run: python nba/generate_nba_dvp.py

      - name: Verify NBA DVP
        run: python nba/verify_nba_dvp.py

      - name: Restore last published NBA snapshots (paid data is not in git)
        run: python pipeline/restore_snapshots.py --prefix nba/
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Fetch NBA PrizePicks lines
        id: lines
        env:
          NBA_PP_RAW_OUT: ${{ runner.temp }}/nba-prizepicks-raw.json
        run: |
          set -o pipefail
          python nba/nba-pp-odds.py | tee "$RUNNER_TEMP/nba-pp.txt"
          TOTAL=$(sed -n 's/^Lines:.*(\([0-9][0-9]*\))$/\1/p' "$RUNNER_TEMP/nba-pp.txt" | tail -n 1)
          if [ -z "$TOTAL" ]; then
            echo "Could not read the fresh PrizePicks line count."
            exit 1
          fi
          echo "Fresh PrizePicks line count: $TOTAL"
          echo "line_count=$TOTAL" >> "$GITHUB_OUTPUT"
          if [ "$TOTAL" -gt 0 ]; then
            echo "has_lines=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_lines=false" >> "$GITHUB_OUTPUT"
            echo "No PrizePicks lines this run. Publish will be skipped."
          fi

      # Raw PrizePicks NBA feed for this build (public lines only, no
      # projections or CG), kept 7 days to show how each line was labeled.
      - name: Save raw PrizePicks NBA feed
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: nba-prizepicks-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nba-prizepicks-raw.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Fill NBA projections and edges
        run: |
          set +e
          python nba/generate_nba_projections.py
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if [ "${{ steps.lines.outputs.has_lines }}" != "true" ]; then
            echo "No fresh lines to project."
            exit 0
          fi
          exit "$status"

      - name: Build NBA prop correlations
        if: steps.lines.outputs.has_lines == 'true'
        continue-on-error: true
        run: python pipeline/build_correlations.py --sport nba

      - name: Publish NBA prop lines to Supabase
        if: steps.lines.outputs.has_lines == 'true'
        timeout-minutes: 10
        run: python publish_supabase.py
        env:
          PUBLISH_ONLY_PREFIX: "nba/projections"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Publish public board status
        if: always()
        continue-on-error: true
        run: |
          bash pipeline/commit_status.sh "chore: nba board status"

  # GitHub drops most of data-refresh.yml's own cron ticks. This separate job
  # starts the KBO refresh when KBO is due (see kbo-due-kick.yml). It has no
  # needs and never fails, so it cannot block or fail the job above.
  kbo-due:
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/kbo-due-kick.yml
