name: Refresh NFL Unabated Odds

# Keeps the PP Odds board on the public Unabated file.
# https://content.unabated.com/markets/b_playerprops.json
#
# The 30-minute cron on nfl-refresh.yml is not actually 30 minutes. GitHub
# drops most of those schedule ticks, so that job was landing every 3-6 hours
# while Unabated itself moves within seconds. This workflow is the same
# refresh (projections, then nfl/sharp_odds.py, then the Supabase snapshot).
# A finished run queues the next one. The hourly cron only restarts the chain
# if that handoff dies. No Odds API key and no other book feed.

on:
  schedule:
    # Restarts the chain if a run is killed before it can queue the next one.
    # GitHub often delivers this late. The push below starts it on merge.
    - cron: "13 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nfl-odds-live.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: nfl-unabated-odds
  cancel-in-progress: false

jobs:
  refresh-nfl-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # The fetch itself is about a minute. Sleeping here keeps one chain
      # about 30 minutes apart without another scheduler.
      NFL_ODDS_REFRESH_WAIT_SECONDS: "1500"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install snapshot dependencies
        run: pip install pandas requests "psycopg[binary]"

      # PrizePicks lines live in projections.json, which is not in git.
      # sharp_odds.py skips the snapshot when that file is missing.
      - name: Build current NFL projections and starting lineups
        run: timeout 240 python nfl/build_projection_data.py
        env:
          BOARD_READER_DB_URL: ${{ secrets.BOARD_READER_DB_URL }}

      - name: Match NFL PrizePicks lines to Unabated sportsbook odds
        continue-on-error: true
        run: timeout 180 python nfl/sharp_odds.py

      - name: Publish protected NFL snapshot
        if: github.ref == 'refs/heads/main'
        timeout-minutes: 10
        run: python publish_supabase.py
        env:
          PUBLISH_ONLY_PREFIX: "nfl/"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # The free top 3 reads this snapshot. The bake waits out its window
      # instead of deploying once per odds tick.
      - name: Queue the homepage free top 3 bake
        if: success() && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bake-free-top3.yml --ref main

      # Open + closing price per book quote for the CG odds backtest. Reuses
      # the pull above (no new request). Soft-fails until
      # sql/nfl_prop_odds_history.sql is applied. Nothing on the site reads it.
      - name: Log NFL book prop prices (open/close history)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: timeout 120 python nfl/prop_odds_history.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Publish public board status
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          bash pipeline/commit_status.sh "chore: nfl board status"

      - name: Queue the next Unabated refresh
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Next Unabated fetch in ${NFL_ODDS_REFRESH_WAIT_SECONDS}s"
          sleep "${NFL_ODDS_REFRESH_WAIT_SECONDS}"
          gh workflow run nfl-odds-live.yml --ref main

  # GitHub drops most of nba-props-refresh.yml's cron ticks, and it has also
  # dropped nba-refresh.yml's 4:00 AM ET tick. This job's self-requeue chain
  # runs about every 25 minutes. This separate job starts the NBA props
  # refresh when NBA is due, and between 4:15 and 6:00 AM ET starts the full
  # refresh when that morning build did not land (see nba-due-kick.yml). It
  # has no needs and never fails, so it cannot block or fail the job above.
  nba-due:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: write
      issues: write
    uses: ./.github/workflows/nba-due-kick.yml
