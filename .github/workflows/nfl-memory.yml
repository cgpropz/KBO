name: NFL Props Memory Grade

# Grades completed NFL gamedays after nflverse weekly stats catch up.
# Daily, so Thursday and Monday games are graded the next morning instead of
# waiting for Tuesday (TNF 10/15/2026 sat ungraded for 3+ days). Unfinished
# days are left waiting: a day is final only when every game has a score and
# a player is DNP only when his team has nflverse stat rows. Off the hour
# because GitHub drops on-the-hour schedules.

on:
  schedule:
    - cron: "23 14 * * *" # 10:23 AM ET daily (9:23 AM ET after DST ends)
  workflow_dispatch:
    inputs:
      date:
        description: "Optional gameday (mm/dd/YYYY or YYYY-MM-DD)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: nfl-memory
  cancel-in-progress: false

jobs:
  grade-nfl-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install pandas requests

      - name: Grade NFL memory day
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python pipeline/memory/grade_nfl_day.py --date "${{ github.event.inputs.date }}"
          else
            python pipeline/memory/grade_nfl_day.py
          fi

      - name: Publish memory/
        run: |
          bash pipeline/memory/commit_memory.sh "chore: nfl memory grade"
