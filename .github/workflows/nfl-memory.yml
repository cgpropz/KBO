name: NFL Props Memory Grade

# Grades completed NFL gamedays after nflverse weekly stats catch up
# (typically Tue/Wed). The script grades every unfinished slate through
# yesterday, not only the most recent Sunday, so Thursday and Monday
# Night Football are included.

on:
  schedule:
    # 10:11 AM ET Tue/Wed while daylight time is in effect (14:11 UTC).
    # After clocks fall back this is 9:11 AM ET. The minute is 11 on purpose:
    # GitHub drops a lot of schedules that land on :00. This job's 14:00 UTC
    # tick on 2026-10-06 never started; 2026-09-29 and 2026-09-30 only
    # landed about five hours late.
    - cron: "11 14 * * 2,3"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional gameday (mm/dd/YYYY or YYYY-MM-DD)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: nfl-memory
  cancel-in-progress: false

jobs:
  grade-nfl-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install pandas requests

      - name: Grade NFL memory day
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python pipeline/memory/grade_nfl_day.py --date "${{ github.event.inputs.date }}"
          else
            python pipeline/memory/grade_nfl_day.py
          fi

      - name: Publish memory/
        run: |
          bash pipeline/memory/commit_memory.sh "chore: nfl memory grade"
