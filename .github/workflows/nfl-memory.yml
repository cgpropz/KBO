name: NFL Props Memory Grade

# Grades completed NFL gamedays after nflverse weekly stats catch up
# (typically Tue/Wed).

on:
  schedule:
    - cron: "0 14 * * 2,3" # 10:00 AM ET Tue/Wed
  workflow_dispatch:
    inputs:
      date:
        description: "Optional gameday (mm/dd/YYYY or YYYY-MM-DD)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: nfl-memory
  cancel-in-progress: false

jobs:
  grade-nfl-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install pandas requests

      - name: Grade NFL memory day
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python pipeline/memory/grade_nfl_day.py --date "${{ github.event.inputs.date }}"
          else
            python pipeline/memory/grade_nfl_day.py
          fi

      - name: Publish memory/
        run: |
          bash pipeline/memory/commit_memory.sh "chore: nfl memory grade"
