name: NBA board freeze (artifact)

# Pre-tip save of PrizePicks standard NBA lines + published projection/CG/side.
# Uploads an ENCRYPTED workflow artifact only. Never commits paid board data
# (repo is public; any signed-in GitHub user can download artifacts).
#
# GitHub cron is UTC. Times below are Eastern Daylight (UTC-4):
#   15 18 * * *  → 2:15 PM ET
#   15 22 * * *  → 6:15 PM ET
#   45 0  * * *  → 8:45 PM ET
# After the Nov 1, 2026 DST → EST shift (UTC-5), move each cron one hour later
# in UTC (19:15, 23:15, 01:45) so wall-clock ET stays the same.
#
# Oct 20 opening night tips (ET): BOS@DET 3:00 PM, PHI@NY 7:00 PM, OKC@SA 9:30 PM.
#
# Board age: before saving, read the public NBA board clock (board_status).
# Older than 60 minutes inside the NBA window: start nba-props-refresh.yml
# (-f trigger=nba-due, so its gate still applies) and wait up to 8 minutes
# for the clock to move. The board is saved either way. After the upload the
# job fails when the public clock was over 60 minutes old or unreadable, or
# when the saved rows' own projection_generated_at is over 60 minutes before
# capture (or missing).

on:
  schedule:
    - cron: "15 18 * * *"
    - cron: "15 22 * * *"
    - cron: "45 0 * * *"
  workflow_dispatch:
    inputs:
      include_upcoming:
        description: "Save next tip slate even if tip is not today (for proofs)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: nba-board-freeze
  cancel-in-progress: false

jobs:
  freeze:
    # Schedules only fire on the default branch. Dispatch can target any branch.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Start nba-props-refresh.yml when the board is older than 60 minutes.
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set freeze output dir
        run: echo "NBA_BOARD_FREEZE_OUT=${RUNNER_TEMP}/nba-board" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Check NBA board age
        id: age_pre
        continue-on-error: true
        run: python3 -m pipeline.board_age --sport nba --max-age-minutes 60

      # Inside the NBA window only, so an off day does not start a refresh.
      - name: Refresh a stale NBA board before the freeze
        if: steps.age_pre.outputs.stale != 'false' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          code=0
          python3 -m pipeline.refresh_window --sport nba || code=$?
          if [ "$code" -ne 0 ]; then
            echo "Outside the NBA game window (exit ${code}); not starting a refresh."
            exit 0
          fi
          gh workflow run nba-props-refresh.yml --ref main -f trigger=nba-due
          python3 -m pipeline.board_age --sport nba --max-age-minutes 60 --wait-seconds 480 --interval 30

      - name: NBA board age at freeze
        id: age
        continue-on-error: true
        run: python3 -m pipeline.board_age --sport nba --max-age-minutes 60

      - name: Freeze NBA board (standard only)
        id: freeze
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$NBA_BOARD_FREEZE_OUT"
          EXTRA=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.include_upcoming }}" != "false" ]; then
            EXTRA+=(--include-upcoming)
          fi
          python -m nba.board_freeze --out-dir "$NBA_BOARD_FREEZE_OUT" "${EXTRA[@]}"

      - name: Encrypt board (plaintext never uploaded)
        id: encrypt
        if: steps.freeze.outputs.skipped == 'false'
        env:
          NBA_FREEZE_KEY: ${{ secrets.NBA_FREEZE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NBA_FREEZE_KEY:-}" ]; then
            echo "::error::NBA_FREEZE_KEY secret is not set"
            exit 1
          fi
          shopt -s nullglob
          boards=("$NBA_BOARD_FREEZE_OUT"/board_*.json)
          if [ "${#boards[@]}" -eq 0 ]; then
            echo "::error::No board JSON to encrypt"
            exit 1
          fi
          BOARD="${boards[0]}"
          ENC="${BOARD}.enc"
          openssl enc -aes-256-cbc -pbkdf2 -salt -in "$BOARD" -out "$ENC" -pass env:NBA_FREEZE_KEY
          rm -f "$BOARD"
          # Do not print board contents or the key.
          echo "encrypted_name=$(basename "$ENC")" >> "$GITHUB_OUTPUT"
          ls -la "$ENC"

      - name: Upload encrypted board artifact
        if: steps.freeze.outputs.skipped == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: nba-board-${{ steps.freeze.outputs.artifact_hint }}
          path: ${{ runner.temp }}/nba-board/board_*.json.enc
          retention-days: 90
          if-no-files-found: error

      # After the upload, so the record is kept. Red run = the public clock was
      # over 60 minutes old or unreadable (an empty output counts: the age
      # step is continue-on-error), or the saved rows' newest
      # projection_generated_at was over 60 minutes before capture or missing.
      - name: Fail when the saved NBA board was over 60 minutes old
        if: steps.freeze.outputs.skipped == 'false' && (steps.age.outputs.stale != 'false' || steps.freeze.outputs.board_stale != 'false')
        env:
          CLOCK_STALE: ${{ steps.age.outputs.stale }}
          CLOCK_AT: ${{ steps.age.outputs.updated_at }}
          CLOCK_AGE: ${{ steps.age.outputs.age_min }}
          SAVED_STALE: ${{ steps.freeze.outputs.board_stale }}
          SAVED_AT: ${{ steps.freeze.outputs.board_generated_at }}
          SAVED_AGE: ${{ steps.freeze.outputs.board_age_min }}
        run: |
          echo "::error title=NBA board stale at freeze::public clock stale=${CLOCK_STALE:-unread} (${CLOCK_AT:-unreadable}, ${CLOCK_AGE:-?} min); saved board stale=${SAVED_STALE:-unread} (projections ${SAVED_AT:-unknown}, ${SAVED_AGE:-?} min before capture); limit 60"
          exit 1
