name: Refresh NBA Data

# Python-only NBA refresh. There is no NBA Express backend.
#
# Refreshes ESPN rosters and regular-season box scores, rebuilds the
# five-position DVP tables (2026-27 blended with 2025-26), pulls PrizePicks
# lines, fills projections, and publishes the gitignored snapshots to
# Supabase. nba_public is not changed.
#
# Paid JSON under kbo-props-ui/public/data/nba/ is published, never committed.
# A 2026-27 box score file is committed only if the refresh script has written
# one. This job does not call Unabated or apply_live_formula.py.
# nba/game_markets.py is the projection-only shadow board. It does not
# download odds unless a later run sets the odds flag. Leans stay empty.
#
# The 4:00 AM ET cron is the post-finals full refresh. Props lines stay on
# nba-props-refresh.yml inside tip-5h..tip+3h, so they are not a substitute
# once the last tip is more than 3 hours behind. A second cron at 4:20 AM ET
# covers a dropped 4:00 tick (GitHub dropped that tick on Oct 24, 2026). If
# both are dropped, nba-due-kick.yml starts this workflow after 4:15 AM ET
# when the public board is still older than 2 hours on a day with an NBA
# slate. A plain manual run always refreshes. The 4:20 run and that wake
# skip when a full refresh already succeeded in the last 90 minutes.

on:
  schedule:
    # GitHub cron is UTC. Labels below are Eastern Daylight (UTC-4). During
    # Eastern Standard the same crons run one hour earlier. The morning wake
    # in nba-due-kick.yml is keyed off America/New_York, so it stays at
    # 4:15 AM ET in both seasons.
    - cron: "0 22 * * *" # 6:00 PM ET, before the early tip
    - cron: "0 1 * * *" # 9:00 PM ET, during the national window
    - cron: "0 8 * * *" # 4:00 AM ET, after west-coast finals
    - cron: "20 8 * * *" # 4:20 AM ET backup if GitHub drops the 4:00 tick
  workflow_dispatch:
    inputs:
      trigger:
        # Empty for a manual run (always refreshes). nba-morning is the wake
        # from nba-due-kick.yml; nba-refresh-due.sh gives it the same
        # 90-minute collapse as the 4:20 cron.
        description: "Leave empty for a manual run"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: nba-refresh-pipeline
  cancel-in-progress: false

jobs:
  gate:
    name: Skip a duplicate full refresh
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.gate.outputs.due }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Decide whether this run should refresh
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESH_TRIGGER: ${{ inputs.trigger }}
        run: bash .github/scripts/nba-refresh-due.sh

  refresh-nba:
    needs: gate
    if: needs.gate.outputs.due == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install requests pandas

      - name: Refresh NBA gamelogs (ESPN)
        run: python nba/refresh_nba_data.py

      - name: Generate five-position NBA DVP tables
        run: python nba/generate_nba_dvp.py

      - name: Verify NBA DVP
        run: python nba/verify_nba_dvp.py

      # Fills only files this checkout does not already have. Fresh rosters,
      # DVP, and a new PrizePicks board are not overwritten. A zero-line pull
      # can then keep the last published board instead of leaving the file absent.
      - name: Restore last published NBA snapshots (paid data is not in git)
        run: python pipeline/restore_snapshots.py --prefix nba/
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Fetch NBA PrizePicks lines
        run: python nba/nba-pp-odds.py
        env:
          NBA_PP_RAW_OUT: ${{ runner.temp }}/nba-prizepicks-raw.json

      # Raw PrizePicks NBA feed for this build (public lines only, no
      # projections or CG), kept 7 days to show how each line was labeled.
      - name: Save raw PrizePicks NBA feed
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: nba-prizepicks-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nba-prizepicks-raw.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Fill NBA projections and edges
        run: |
          set +e
          python nba/generate_nba_projections.py
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          board="kbo-props-ui/public/data/nba"
          if [ ! -f "$board/projections_standard.json" ] \
            && [ ! -f "$board/projections_demon.json" ] \
            && [ ! -f "$board/projections_goblin.json" ]; then
            echo "No PrizePicks board to project. Rosters and DVP still publish."
            exit 0
          fi
          exit "$status"

      - name: Build NBA prop correlations
        continue-on-error: true
        run: python pipeline/build_correlations.py --sport nba

      # Shadow spread/total board. Projection-only. A failure here must not
      # block the player-prop publish below. Memory archive is the dated
      # snapshot used later for closing-line value.
      - name: Build NBA game-market projections
        continue-on-error: true
        run: python nba/game_markets.py

      - name: Publish NBA game-market memory archive
        if: always()
        continue-on-error: true
        run: |
          bash pipeline/memory/commit_memory.sh "chore: nba game market archive"

      - name: Publish NBA snapshots to Supabase
        timeout-minutes: 10
        run: python publish_supabase.py
        env:
          PUBLISH_ONLY_PREFIX: "nba/"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Publish public board status
        if: always()
        continue-on-error: true
        run: |
          bash pipeline/commit_status.sh "chore: nba board status"

      - name: Commit non-paid NBA artifacts
        run: |
          # kbo-props-ui/public/data/nba/* is paid data. It is git-ignored and
          # the helper refuses it. The optional 2026-27 CSV is committed only
          # once a refresh writes it (the helper skips files this run did not
          # change or create).
          # commit_data_paths.sh commits from a clean worktree of origin/main,
          # so the other generated files this job leaves modified can no
          # longer block a rebase when main moves mid-run. A rejected push is
          # rebuilt on the new main with backoff, and the step fails if the
          # files still do not reach main.
          bash pipeline/commit_data_paths.sh "chore: auto-refresh NBA data" \
            nba/nba_boxscores_2025_26.csv \
            nba/nba_boxscores_2026_27.csv \
            nba/mappings/player_positions.json \
            nba/mappings/team_mappings.json \
            nba/mappings/unset_positions.json \
            nba/nbaPGdvp.csv \
            nba/nbaSGdvp.csv \
            nba/nbaSFdvp.csv \
            nba/nbaPFdvp.csv \
            nba/nbaCdvp.csv

      - name: Notify on failure (open/update issue)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/notify-failure.sh "🚨 NBA data refresh FAILED"
