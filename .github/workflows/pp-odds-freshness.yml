name: PP Odds freshness

# The PP Odds build steps (nfl/sharp_odds.py, nhl.sharp_odds, nba.sharp_odds)
# run with continue-on-error, so a broken step keeps the refresh green while
# the snapshot stops moving (2026-10-20 to 10-22: nfl_sharp_odds sat for about
# 35 hours). This separate job reads each snapshot's updated_at and fails,
# with a ::warning, when it is over 3 hours old while a game is still to
# start today (ET). It also fails when the NHL board still has props and
# nhl_sharp_odds prizepicks_prop_count is 0. Nothing depends on this
# workflow, so a red run blocks no refresh or publish. Reads only; no
# writes, commits, or secrets in the log.

on:
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pp-odds-freshness
  cancel-in-progress: true

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check NFL, NHL and NBA PP Odds snapshots
        run: python -m pipeline.pp_odds_freshness --sports nfl,nhl,nba --max-age-hours 3 --fail-stale
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
