<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex" />
  <title>Set a new password | CGPropz</title>
  <script>
    // Recovery tokens arrive in the hash. Forward them to the app route that
    // calls updateUser. The email's redirectTo stays on /set-password.
    (function () {
      var target = new URL('/', window.location.origin);
      target.searchParams.set('recovery', '1');
      var incoming = new URL(window.location.href);
      incoming.searchParams.forEach(function (value, key) {
        if (key !== 'recovery') target.searchParams.set(key, value);
      });
      target.hash = incoming.hash;
      window.location.replace(target.pathname + target.search + target.hash);
    })();
  </script>
</head>
<body>
  <p><a href="/?recovery=1">Continue to set a new password</a></p>
</body>
</html>
